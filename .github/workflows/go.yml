name: Go

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26

    - name: Build
      run: go build -ldflags "-X main.VERSION=${GITHUB_REF##*/}" -o ip2geo -v ./...

    - name: Test version
      run: ./ip2geo -version

    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: ip2geo
        path: ip2geo

  download-maxmind:
    runs-on: ubuntu-latest
    steps:
    - name: Download MaxMind
      env:
        MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      run: wget -O maxmind.zip --user=145768 --password=$MAXMIND_LICENSE_KEY 'https://download.maxmind.com/geoip/databases/GeoLite2-City-CSV/download?suffix=zip'

    - name: Upload MaxMind db
      uses: actions/upload-artifact@v7
      with:
        name: maxmind
        path: maxmind.zip

  test:
    runs-on: ubuntu-latest
    needs: [ build, download-maxmind ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ipv4
            flags: -maxmind-filename maxmind.zip
            test: t/nginx_geo.t
          - name: ipv4-en-nobase64
            flags: -lang en -nobase64 -maxmind-filename maxmind.zip
            test: t/nginx_geo.t
          - name: ipv6
            flags: -ipver 6 -maxmind-filename maxmind.zip -maxmind
            test: t/nginx_geo_ipv6.t
          - name: ipv6-en-nobase64
            flags: -ipver 6 -lang en -nobase64 -maxmind-filename maxmind.zip -maxmind
            test: t/nginx_geo_ipv6.t
    steps:
    - uses: actions/checkout@v6

    - name: Set up environment
      run: |
        sudo apt-get install -y nginx tzdata cpanminus
        sudo cpanm --quiet local::lib
        eval $(perl -Mlocal::lib)
        sudo cpanm --quiet --notest Test::Nginx::Socket

    - name: Download binary
      uses: actions/download-artifact@v8
      with:
        name: ip2geo

    - name: Download MaxMind db
      uses: actions/download-artifact@v8
      with:
        name: maxmind

    - name: Test ${{ matrix.name }}
      run: |
        chmod +x ./ip2geo
        ./ip2geo ${{ matrix.flags }}
        TEST_NGINX_IP2GEO_DIR=$PWD prove ${{ matrix.test }}

  release-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_type == 'tag'
    strategy:
      matrix:
        goos: [ darwin, linux, freebsd, openbsd ]
        arch: [ 386, arm, amd64, arm64 ]
        exclude:
          - goos: darwin
            arch: 386
          - goos: darwin
            arch: arm
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26

    - name: Build release file
      run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.arch }} go build -ldflags "-X main.VERSION=${GITHUB_REF##*/}" -o ip2geo-${{ matrix.goos }}-${{ matrix.arch }} ./...

    - name: Upload release file
      uses: actions/upload-artifact@v7
      with:
        name: ip2geo-${{ matrix.goos }}-${{ matrix.arch }}
        path: ip2geo-${{ matrix.goos }}-${{ matrix.arch }}

  release:
    runs-on: ubuntu-latest
    needs: release-build
    if: github.ref_type == 'tag'
    steps:
    - name: Download release files
      uses: actions/download-artifact@v8
      with:
        pattern: ip2geo-*
        merge-multiple: true

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        files: ip2geo-*
