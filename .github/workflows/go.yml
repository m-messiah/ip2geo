name: Go

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26
    
    - name: Set up environment
      run: |
        sudo apt-get install -y nginx tzdata cpanminus
        sudo cpanm --quiet local::lib
        eval $(perl -Mlocal::lib)
        sudo cpanm --quiet --notest Test::Nginx::Socket
    
    - name: Build
      run: go build -ldflags "-X main.VERSION=${GITHUB_REF##*/}" -o ip2geo -v ./...

    - name: Test version
      run: ./ip2geo -version

    - name: Download MaxMind
      env:
        MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      run: wget -O maxmind.zip --user=145768 --password=$MAXMIND_LICENSE_KEY 'https://download.maxmind.com/geoip/databases/GeoLite2-City-CSV/download?suffix=zip'

    - name: Test maxmind
      run: |
        ./ip2geo -maxmind-filename maxmind.zip
        TEST_NGINX_IP2GEO_DIR=$PWD prove t/nginx_geo.t

    - name: Test nobase64
      run: |
        ./ip2geo -lang en -nobase64 -maxmind-filename maxmind.zip
        TEST_NGINX_IP2GEO_DIR=$PWD prove t/nginx_geo.t
    - name: Test ipv6
      run: |
        ./ip2geo -ipver 6 -maxmind-filename maxmind.zip -maxmind
        TEST_NGINX_IP2GEO_DIR=$PWD prove t/nginx_geo_ipv6.t
    - name: Test ipv6 for en
      run: |
        ./ip2geo -ipver 6 -lang en -nobase64 -maxmind-filename maxmind.zip -maxmind
        TEST_NGINX_IP2GEO_DIR=$PWD prove t/nginx_geo_ipv6.t
        
    - name: Build release files
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      run: |
        for goos in darwin linux freebsd openbsd; do
          for arch in 386 arm amd64 arm64; do
            if [ "$goos" = "darwin" ] && { [ "$arch" = "386" ] || [ "$arch" = "arm" ]; }; then
              continue
            fi
            GOOS=$goos GOARCH=$arch go build -ldflags "-X main.VERSION=${GITHUB_REF##*/}" -o ip2geo-$goos-$arch ./...
          done
        done
    - name: Release
      uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        generate_release_notes: true
        files: ip2geo-*
